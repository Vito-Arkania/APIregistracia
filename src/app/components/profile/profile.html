<section class="profile-page">
  <aside class="sidebar">
    <div class="user-brief">
      <div class="avatar">U</div>
      <h3>User</h3>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn active">Personal Info</button>
      <button class="nav-btn">Order History</button>
    </nav>
  </aside>

  <main class="content">
    <div class="profile-header">
      <h2>Personal Information</h2>
    </div>

    <div class="form-grid">
      <div class="field">
    <label>First Name</label>
    <input type="text" [value]="user?.firstName || ''" disabled>
  </div>
  <div class="field">
    <label>Last Name</label>
    <input type="text" [value]="user?.lastName || ''" disabled>
  </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" value="dadk@gmail.com" disabled>
      </div>
    </div>

    <div class="perks-section">
      <h3>🧁 Unlock Bakery Perks</h3>
      <div class="upgrade-cards">
        <div class="upgrade-item">
          <h4>VIP Delivery</h4>
          <p>Free priority delivery</p>
          <button class="buy-btn">Buy for $9.99</button>
        </div>
        <div class="upgrade-item">
          <h4>Baker's Club</h4>
          <p>Double loyalty points</p>
          <button class="buy-btn">Buy for $15.00</button>
        </div>
      </div>
    </div>
  </main>
</section>
